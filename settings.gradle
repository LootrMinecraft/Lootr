pluginManagement {
    repositories {
        maven {
            url = 'https://maven.fabricmc.net/'
        }
        maven { url = "https://maven.neoforged.net/" }
        mavenCentral()
        gradlePluginPortal()
    }
}

plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '0.8.0'
}

rootProject.name = "Lootr"

include 'common', 'fabric', 'neoforge'
